<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Post</title>
        <!-- The same stylesheet as the feed, so both pages look the same. -->
        <link rel="stylesheet" href="/theme.css" />
        <!-- Layout for this page only. Colours and fonts come from theme.css. -->
        <style>
            form {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .row {
                display: flex;
                gap: 16px;
                align-items: center;
                flex-wrap: wrap;
            }
            /* Its own line under Post, always one line tall even when empty,
               so messages appearing and clearing never move anything. Long
               messages are cut off with "..." and show in full on hover. */
            #status {
                margin: 0;
                min-height: 1.5em;
                line-height: 1.5em;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            /* "Recent" with the View feed link on the right. */
            .recent-heading {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                margin-top: 2em;
            }
            .recent-heading h2 {
                margin: 0;
            }
            /* Recent posts: date, then text, like a blog archive list. */
            ul.recent {
                list-style: none;
                padding: 0;
            }
            ul.recent li {
                display: flex;
                gap: 12px;
                align-items: baseline;
                padding: 2px 0;
            }
            ul.recent time {
                flex: none;
                white-space: nowrap;
            }
            /* Same size as post titles on the feed. */
            h2 {
                font-size: 1.2em;
                margin: 2em 0 0;
            }
            ul.recent .text {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            /* Delete looks like a quiet link, not a big button. */
            /* Edit and Delete look like quiet links, not big buttons. */
            button.edit,
            button.delete {
                border: none;
                padding: 0;
                font-size: 14px;
                color: var(--link);
            }
            button.delete {
                color: var(--danger);
            }
            button.edit:hover,
            button.delete:hover {
                text-decoration: underline;
            }
            #editing {
                margin: 0 0 12px;
            }
            textarea.dragging {
                border-color: var(--link);
            }
            [hidden] {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <main>
            <!-- Shown until the upload token has been entered once. -->
            <form id="token-form" hidden>
                <label for="token">Upload token</label>
                <input id="token" type="password" autocomplete="off" required />
                <div class="row"><button type="submit">Save</button></div>
                <p class="muted">Saved in this browser only.</p>
            </form>

            <div id="app" hidden>
                <!-- Shown while an existing post is loaded into the form. -->
                <p id="editing" class="muted" hidden>
                    Editing <span id="editing-what"></span>.
                    <a href="#" id="cancel-edit">Cancel</a>
                </p>
                <form id="post-form">
                    <input
                        name="title"
                        type="text"
                        placeholder="Title (optional)"
                        maxlength="200"
                    />
                    <textarea
                        name="caption"
                        placeholder="Write something."
                    ></textarea>
                    <div class="row">
                        <button type="button" id="add-media">Add media</button>
                        <!-- Hidden; opened by the Add media button. -->
                        <input
                            id="media-input"
                            type="file"
                            accept="image/*,video/*,audio/*"
                            multiple
                            hidden
                        />
                    </div>
                    <div class="row">
                        <label
                            ><input
                                name="private"
                                type="checkbox"
                                value="true"
                            />
                            Private</label
                        >
                        <button type="submit" title="Post (⌘ + Enter)">
                            Post
                        </button>
                    </div>
                    <p id="status" class="muted"></p>
                </form>

                <div class="recent-heading">
                    <h2>Recent</h2>
                    <a href="__SITE_URL__" target="_blank">View feed</a>
                </div>
                <ul id="recent" class="recent"></ul>

                <p class="muted"><a href="#" id="forget">Forget token</a></p>
            </div>
        </main>

        <script>
            const TOKEN_KEY = "feedUploadToken";

            const tokenForm = document.getElementById("token-form");
            const app = document.getElementById("app");
            const postForm = document.getElementById("post-form");
            const statusText = document.getElementById("status");
            const recentList = document.getElementById("recent");

            function getToken() {
                try {
                    return localStorage.getItem(TOKEN_KEY);
                } catch {
                    return null;
                }
            }

            function setToken(token) {
                try {
                    if (token) localStorage.setItem(TOKEN_KEY, token);
                    else localStorage.removeItem(TOKEN_KEY);
                } catch {}
            }

            function showTokenForm() {
                setToken(null);
                app.hidden = true;
                tokenForm.hidden = false;
            }

            function showApp() {
                tokenForm.hidden = true;
                app.hidden = false;
                loadRecent();
            }

            tokenForm.addEventListener("submit", (event) => {
                event.preventDefault();
                setToken(document.getElementById("token").value.trim());
                showApp();
            });

            document
                .getElementById("forget")
                .addEventListener("click", (event) => {
                    event.preventDefault();
                    showTokenForm();
                });

            // Small wrapper that adds the token and handles a wrong one.
            async function api(method, url) {
                const response = await fetch(url, {
                    method,
                    headers: { Authorization: `Bearer ${getToken()}` },
                });
                if (response.status === 401) {
                    showTokenForm();
                    throw new Error("Wrong token");
                }
                return response.json();
            }

            async function loadRecent() {
                const { entries } = await api("GET", "/api/entries");
                recentList.replaceChildren(...entries.map(renderEntry));
            }

            // Built with textContent, never innerHTML, so post text
            // can never inject markup into this page.
            function renderEntry(entry) {
                const item = document.createElement("li");

                const date = document.createElement("time");
                date.dateTime = entry.created_at;
                // Short form, e.g. "10 Oct, 11:55", to leave room on phones.
                date.textContent = new Date(entry.created_at).toLocaleString(
                    "en-GB",
                    {
                        day: "2-digit",
                        month: "short",
                        hour: "2-digit",
                        minute: "2-digit",
                        timeZone: "Europe/London",
                    }
                );

                // Public posts link to their own page on the feed site.
                const text = document.createElement(
                    entry.private ? "span" : "a"
                );
                if (!entry.private) {
                    text.href = `__SITE_URL__/p/${entry.id}`;
                    text.target = "_blank";
                }
                text.className = "text";
                const label = entry.title || entry.caption || `(${entry.type})`;
                text.textContent =
                    (entry.private ? "[private] " : "") +
                    (entry.type !== "text" ? `[${entry.type}] ` : "") +
                    label;

                const remove = document.createElement("button");
                remove.className = "delete";
                remove.textContent = "Delete";
                remove.addEventListener("click", async () => {
                    if (!confirm(`Delete "${label.slice(0, 60)}"?`)) return;
                    await api("DELETE", `/api/entries/${entry.id}`);
                    if (editingId === entry.id) stopEditing();
                    loadRecent();
                });

                const edit = document.createElement("button");
                edit.className = "edit";
                edit.textContent = "Edit";
                edit.addEventListener("click", () =>
                    startEditing(entry, date.textContent)
                );

                item.append(date, text, edit, remove);
                return item;
            }

            const textarea = postForm.elements.caption;

            // Keep the hover text in sync with the (possibly cut off) status.
            new MutationObserver(() => {
                statusText.title = statusText.textContent;
            }).observe(statusText, { childList: true, characterData: true });
            const postButton = postForm.querySelector('button[type="submit"]');
            const mediaInput = document.getElementById("media-input");

            // ---- Embedded media ----
            //
            // Each file is uploaded and processed straight away. While that
            // happens, a placeholder line sits in the text; when it is done,
            // the placeholder becomes "![](media/<file>)". Post stays disabled
            // until every file is ready, so a post never has broken media.

            let pendingUploads = 0;
            let uploadCounter = 0;
            // Problems are collected and shown once every file has finished,
            // so a quick failure is not hidden by later progress messages.
            let uploadErrors = [];

            function refreshPostButton() {
                postButton.disabled = pendingUploads > 0;
                if (pendingUploads > 0) {
                    const files = pendingUploads === 1 ? "file" : "files";
                    statusText.textContent = `Adding ${pendingUploads} ${files}...`;
                }
            }

            document
                .getElementById("add-media")
                .addEventListener("click", () => mediaInput.click());

            mediaInput.addEventListener("change", () => {
                addMedia(mediaInput.files);
                mediaInput.value = ""; // so the same file can be picked again
            });

            textarea.addEventListener("dragover", (event) => {
                event.preventDefault();
                textarea.classList.add("dragging");
            });
            textarea.addEventListener("dragleave", () => {
                textarea.classList.remove("dragging");
            });
            textarea.addEventListener("drop", (event) => {
                textarea.classList.remove("dragging");
                if (event.dataTransfer.files.length === 0) return;
                event.preventDefault();
                addMedia(event.dataTransfer.files);
            });
            textarea.addEventListener("paste", (event) => {
                if (event.clipboardData.files.length > 0) {
                    event.preventDefault();
                    addMedia(event.clipboardData.files);
                    return;
                }
                // Pasting a web address over highlighted text makes a link:
                // [highlighted text](https://...)
                const pasted = event.clipboardData.getData("text").trim();
                const selected = selectedText();
                if (selected && /^https?:\/\/\S+$/.test(pasted)) {
                    event.preventDefault();
                    insertAtCursor(`[${escapeCaption(selected)}](${pasted})`);
                }
            });

            // If text is highlighted when media is added, the media replaces
            // it and the highlighted text becomes its caption (for the first
            // file; any others get their file name).
            function addMedia(fileList) {
                const caption = selectedText();
                [...fileList].forEach((file, index) =>
                    uploadMedia(file, index === 0 ? caption : "")
                );
            }

            function selectedText() {
                const { selectionStart, selectionEnd, value } = textarea;
                return value.slice(selectionStart, selectionEnd).trim();
            }

            // A caption sits inside [ ], so it must be one line with any
            // brackets escaped, or it would break the Markdown.
            function escapeCaption(text) {
                return text
                    .replace(/\s+/g, " ")
                    .replace(/[\\[\]]/g, (character) => `\\${character}`);
            }

            // Inserts text where the cursor is (or replaces the selection).
            function insertAtCursor(text) {
                const { selectionStart, selectionEnd } = textarea;
                textarea.setRangeText(
                    text,
                    selectionStart,
                    selectionEnd,
                    "end"
                );
                textarea.focus();
            }

            // Swaps a placeholder for its final text, keeping the cursor
            // where it was. If the placeholder was edited away, the text is
            // added at the end instead.
            function replacePlaceholder(placeholder, text) {
                const index = textarea.value.indexOf(placeholder);
                if (index === -1) {
                    if (text) textarea.value += `\n\n${text}`;
                    return;
                }
                const { selectionStart, selectionEnd } = textarea;
                const shift = text.length - placeholder.length;
                const moved = (position) =>
                    position > index ? position + shift : position;
                textarea.value =
                    textarea.value.slice(0, index) +
                    text +
                    textarea.value.slice(index + placeholder.length);
                textarea.setSelectionRange(
                    moved(selectionStart),
                    moved(selectionEnd)
                );
            }

            // Uses XMLHttpRequest instead of fetch to show upload progress,
            // which matters for videos.
            function uploadMedia(file, caption) {
                uploadCounter += 1;
                const placeholder = `![Uploading ${file.name} (${uploadCounter})...]()`;
                // Replacing highlighted text keeps it in place, inline.
                // Otherwise the media goes on its own line at the cursor.
                insertAtCursor(caption ? placeholder : `\n${placeholder}\n`);
                pendingUploads += 1;
                refreshPostButton();

                const request = new XMLHttpRequest();
                request.open("POST", "/api/media");
                request.setRequestHeader(
                    "Authorization",
                    `Bearer ${getToken()}`
                );

                request.upload.addEventListener("progress", (progress) => {
                    if (!progress.lengthComputable) return;
                    const percent = Math.round(
                        (progress.loaded / progress.total) * 100
                    );
                    // Short, so it fits beside Post even on a phone.
                    statusText.textContent =
                        percent < 100
                            ? `Uploading ${percent}%`
                            : "Processing...";
                });

                const finish = (text, error) => {
                    // On failure, put back any highlighted text it replaced.
                    replacePlaceholder(placeholder, text || caption);
                    if (error) uploadErrors.push(error);
                    pendingUploads -= 1;
                    refreshPostButton();
                    if (pendingUploads === 0) {
                        statusText.textContent = uploadErrors.join("; ");
                        uploadErrors = [];
                    }
                };

                request.addEventListener("load", () => {
                    if (request.status === 401) {
                        finish("");
                        return showTokenForm();
                    }
                    let body = {};
                    try {
                        body = JSON.parse(request.responseText);
                    } catch {}
                    if (request.status >= 400 || !body.markdown) {
                        // Reason first, so it stays readable if the
                        // message is cut off on a narrow screen.
                        const reason =
                            request.status === 415
                                ? "Unsupported file type"
                                : request.status === 413
                                  ? "File too large"
                                  : "Could not process";
                        finish("", `${reason}: ${file.name}`);
                        return;
                    }
                    finish(
                        caption
                            ? `![${escapeCaption(caption)}](${body.src})`
                            : body.markdown
                    );
                });

                request.addEventListener("error", () => {
                    finish("", `Server unreachable: ${file.name}`);
                });

                const form = new FormData();
                form.append("file", file);
                request.send(form);
            }

            // ---- Posting ----

            // Command + Enter (Ctrl + Enter on Windows/Linux) posts from
            // anywhere in the form. requestSubmit runs the submit handler
            // below, the same as clicking Post.
            postForm.addEventListener("keydown", (event) => {
                if (
                    event.key !== "Enter" ||
                    !(event.metaKey || event.ctrlKey)
                ) {
                    return;
                }
                event.preventDefault();
                if (!postButton.disabled) postForm.requestSubmit();
            });

            // ---- Editing ----
            //
            // Edit loads a post into the same form. Post becomes Save, and
            // saving keeps the post's date and place in the feed.

            let editingId = null;
            const editingBanner = document.getElementById("editing");

            function startEditing(entry, dateText) {
                editingId = entry.id;
                postForm.elements.title.value = entry.title ?? "";
                textarea.value = entry.caption ?? "";
                postForm.elements.private.checked = entry.private;
                document.getElementById("editing-what").textContent =
                    `the post from ${dateText}`;
                editingBanner.hidden = false;
                postButton.textContent = "Save";
                statusText.textContent = "";
                window.scrollTo({ top: 0 });
                textarea.focus();
            }

            function stopEditing() {
                editingId = null;
                editingBanner.hidden = true;
                postButton.textContent = "Post";
                postForm.reset();
            }

            document
                .getElementById("cancel-edit")
                .addEventListener("click", (event) => {
                    event.preventDefault();
                    stopEditing();
                });

            // Saving an edit sends JSON to PATCH /api/entries/<id>; a new
            // post sends the form to POST /upload.
            function sendPost() {
                const headers = { Authorization: `Bearer ${getToken()}` };
                if (!editingId) {
                    return fetch("/upload", {
                        method: "POST",
                        headers,
                        body: new FormData(postForm),
                    });
                }
                return fetch(`/api/entries/${editingId}`, {
                    method: "PATCH",
                    headers: { ...headers, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        title: postForm.elements.title.value,
                        caption: textarea.value,
                        private: postForm.elements.private.checked,
                    }),
                });
            }

            postForm.addEventListener("submit", async (event) => {
                event.preventDefault();
                if (pendingUploads > 0) return;
                postButton.disabled = true;
                statusText.textContent = editingId ? "Saving..." : "Posting...";

                try {
                    const response = await sendPost();
                    if (response.status === 401) return showTokenForm();
                    const body = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        statusText.textContent =
                            body.error || "Something went wrong";
                        return;
                    }
                    statusText.textContent = body.message;
                    if (editingId) stopEditing();
                    else postForm.reset();
                    loadRecent();
                } catch {
                    statusText.textContent = "Could not reach the server";
                } finally {
                    postButton.disabled = pendingUploads > 0;
                }
            });

            if (getToken()) showApp();
            else showTokenForm();
        </script>
    </body>
</html>
