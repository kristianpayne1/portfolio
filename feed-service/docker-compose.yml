# Feed service + Cloudflare Tunnel.
#
# Two ports, two jobs:
#   8080  public read-only API (/entries, /media). NOT published on the host.
#         Only cloudflared can reach it, over the private "feed" network.
#   8081  upload API (/upload). Published on 127.0.0.1 only, then shared to
#         your tailnet with "tailscale serve" (see README). Never in the tunnel.
#
# Neither container joins the Gluetun/VPN network. Do not add
# "network_mode: service:gluetun" or the gluetun network here.
#
# Updates: the feed image is built and published by GitHub Actions when
# feed-service/ changes on main. A systemd timer on the EliteDesk pulls it and
# restarts the container (see deploy/ and the README). To build locally
# instead, add the override file:
#   docker compose -f docker-compose.yml -f compose.build.yml up -d --build

services:
    feed:
        image: ghcr.io/kristianpayne1/feed-service:latest
        restart: unless-stopped
        environment:
            # Secrets come from the .env file next to this one.
            UPLOAD_TOKEN: ${UPLOAD_TOKEN}
            DATA_DIR: /data
            PUBLIC_URL: https://media.kristianpayne.dev
            MAX_UPLOAD_MB: 1024
            VIDEO_ENCODER: software
        volumes:
            # Database, media and raw uploads all live in one host folder:
            # FEED_DATA_DIR from .env, or ./data next to this file.
            # create_host_path: false makes the container refuse to start if
            # the folder is missing (for example the SSD is not mounted),
            # instead of quietly starting an empty feed in a new folder.
            - type: bind
              source: ${FEED_DATA_DIR:-./data}
              target: /data
              bind:
                  create_host_path: false
        ports:
            # Localhost only. Tailscale Serve forwards tailnet traffic here.
            - "127.0.0.1:8081:8081"
        # Give a running transcode a moment to finish on "docker compose down".
        stop_grace_period: 30s

        # Hardening: limits what the container could do if its image were
        # ever bad, and stops a runaway job from taking over the machine.
        #   - the image's files are read-only; only ./data (above) and a
        #     small in-memory /tmp can be written
        #   - no Linux capabilities, and no way to gain more privileges
        #   - at most 3 of the 4 CPU cores, 3 GB of memory and 512 processes,
        #     so the rest of the EliteDesk always stays responsive
        read_only: true
        tmpfs:
            - /tmp:size=256m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        cpus: 3
        mem_limit: 3g
        pids_limit: 512
        networks:
            - feed
        # For VA-API hardware encoding later, uncomment and set
        # VIDEO_ENCODER: vaapi above:
        # devices:
        #     - /dev/dri:/dev/dri

    cloudflared:
        image: cloudflare/cloudflared:2026.10.4
        restart: unless-stopped
        command: tunnel --no-autoupdate run
        environment:
            TUNNEL_TOKEN: ${TUNNEL_TOKEN}
        depends_on:
            - feed
        networks:
            - feed

networks:
    feed:
        name: feed
