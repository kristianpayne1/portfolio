# Publishes the feed service as a Docker image when feed-service/ changes on
# main. The EliteDesk checks for a new image every few minutes and restarts
# with it (see feed-service/deploy/ and the README).
#
# This workflow only publishes an image. It has no access to the home lab:
# no SSH, no Tailscale, no self-hosted runner.

name: Publish feed service

on:
    push:
        branches: [main]
        paths:
            - "feed-service/**"
            - ".github/workflows/feed-service.yml"
    # Lets you run it by hand from the Actions tab.
    workflow_dispatch:

permissions:
    contents: read
    packages: write # to publish to ghcr.io

# If two pushes land close together, finish the first before the second.
concurrency:
    group: publish-feed-service
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            # 1. Typecheck. If this fails, the job stops and nothing is published.
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: feed-service/package-lock.json
            - name: Typecheck
              working-directory: feed-service
              run: |
                  npm ci
                  npm run typecheck

            # 2. Build the image for the EliteDesk (x86_64) and publish it.
            #    The image is only pushed if the whole build succeeds.
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v7
              with:
                  context: feed-service
                  platforms: linux/amd64
                  push: true
                  # "latest" is what the EliteDesk runs. The commit tag is
                  # kept so an older version can be run again if needed.
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/feed-service:latest
                      ghcr.io/${{ github.repository_owner }}/feed-service:${{ github.sha }}
                  # Shown by GET /health, to check which version is running.
                  build-args: GIT_SHA=${{ github.sha }}
                  # Reuse unchanged layers (apt, npm) between runs.
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
